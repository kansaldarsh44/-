<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Girlfriend's Day Priya</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#ffeef5,#fff);color:#444}
section{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
h1{font-size:3em;color:#e91e63}button{padding:14px 24px;border:none;border-radius:30px;background:#e91e63;color:#fff;font-size:18px}
.card{max-width:800px;background:#ffffffcc;padding:24px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;width:100%;max-width:900px}
.gallery img{width:100%;border-radius:18px;transition:.4s}.gallery img:hover{transform:scale(1.04)}
#text{white-space:pre-wrap;text-align:left;line-height:1.7}
</style></head>
<body>
<section><h1>Happy Girlfriend's Day, Priya ❤️</h1><p>A little surprise made just for you...</p><button onclick="document.getElementById('letter').scrollIntoView({behavior:'smooth'})">Open My Heart ❤️</button></section>
<section id="letter"><div class="card"><div id="text"></div></div></section>
<section><div class="gallery">
<img src="photo1.jpg"><img src="photo2.jpg"><img src="photo3.jpg">
</div></section>
<section><div class="card"><h2>Please be my forever. ❤️</h2><p>I love you soooooo much ♾️🫶🏻<br><br>Forever Yours,<br><b>Darsh ❤️</b></p></div></section>
<script>
const msg=`Happy Girlfriend's Day, Priya♥️.

You thought I'd do nothing and forget, didn't you? But ur love wouldn't let me forget how special u r to me. I love every gift u've given to me, they are as special as you are to me and they will always be as they'll remind me of u every time I see them.

U made me change a lot and I love those changes like u made me expressive n confident. But the thing I love the most about u is that u're very nice as a person and I got u as my first, please don't change ever. I love u the way u r as u're the best I could ever imagine.

Happy girlfriends day, Priya♥️.

Please be my forever.

I love you soooooo much♾️🫶🏻`;
let i=0;function type(){if(i<msg.length){text.innerHTML+=msg.charAt(i);i++;setTimeout(type,35);}}
type();
</script></body></html>
